name: daily

on:
  schedule:
    - cron: "10 21 * * *"   # 毎日 21:10 UTC = 日本時間 朝6:10
  workflow_dispatch: {}      # Actions の画面から手動でも実行できる

permissions:
  contents: write

concurrency:
  group: trendwatch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 毎日の処理
        env:
          QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
        run: python -m trendwatch daily
      - name: 結果を保存
        run: |
          git config user.name "trendwatch-bot"
          git config user.email "trendwatch-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "daily update $(date -u +%F)"
          git pull --rebase
          git push
