name: media

on:
  schedule:
    - cron: "20 */3 * * *"   # 3時間ごと。短いRSSの見出しをこまめに保存
  workflow_dispatch: {}      # Actions の画面から手動でも実行できる

permissions:
  contents: write

concurrency:
  group: trendwatch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 指定媒体の収集と可視化
        run: python -m trendwatch media
      - name: 結果を保存
        run: |
          git config user.name "trendwatch-bot"
          git config user.email "trendwatch-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "media update $(date -u +%FT%H:%M)"
          git pull --rebase
          git push
